[project]
name = "ai-travel-planner"
version = "0.1.0"
description = "LangGraph travel planning with durable human review"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3.0.1,<4", "pydantic-settings>=2.6,<3", "httpx>=0.28,<1", "anthropic>=0.70,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
